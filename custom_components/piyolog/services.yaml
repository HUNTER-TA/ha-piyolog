get_records:
  name: Get records
  description: Retrieve records from the latest cached PiyoLog feed snapshot without making an extra API request.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional config entry ID (required when multiple PiyoLog feeds are configured).
      required: false
      selector:
        text:
    types:
      name: Record types
      description: Optional list of PiyoLog record types to filter (e.g. Formula, BreastFeeding, Poop).
      required: false
      selector:
        object:
    limit:
      name: Limit
      description: Maximum number of records to return (newest first, 1-500).
      required: false
      default: 50
      selector:
        number:
          min: 1
          max: 500
          mode: box

get_daily_summary:
  name: Get daily summary
  description: Retrieve per-day totals, 7-day averages, care intervals, recent formula records, and sleep sessions from the latest cached snapshot.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional config entry ID (required when multiple PiyoLog feeds are configured).
      required: false
      selector:
        text:
    days:
      name: Days
      description: Maximum number of local calendar days to return (newest days, 1-28).
      required: false
      default: 14
      selector:
        number:
          min: 1
          max: 28
          mode: box
