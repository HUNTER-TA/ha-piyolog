get_records:
  name: Get records
  description: Retrieve records from the locally merged PiyoLog history (default 14 days) without making an extra API request.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional config entry ID (required when multiple PiyoLog feeds are configured).
      required: false
      selector:
        text:
    types:
      name: Record types
      description: Optional list of PiyoLog record types to filter (e.g. Formula, BreastFeeding, Poop).
      required: false
      selector:
        object:
    days:
      name: Days
      description: Optional window in days from now (1-30). Omit to return from all locally retained records.
      required: false
      selector:
        number:
          min: 1
          max: 30
          mode: box
    limit:
      name: Limit
      description: Maximum number of records to return (newest first, 1-2000).
      required: false
      default: 100
      selector:
        number:
          min: 1
          max: 2000
          mode: box

get_daily_summary:
  name: Get daily summary
  description: Retrieve per-day totals, 7-day averages, care intervals, recent formula records, and sleep sessions from the locally merged history.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional config entry ID (required when multiple PiyoLog feeds are configured).
      required: false
      selector:
        text:
    days:
      name: Days
      description: Maximum number of local calendar days to return (newest days, 1-30).
      required: false
      default: 14
      selector:
        number:
          min: 1
          max: 30
          mode: box
